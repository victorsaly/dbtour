name: Release

# Every push to main whose version has no tag yet becomes a tag, a GitHub release with that version's
# changelog section as its notes, and a publish of the three packages to npm. One pull request is one
# release, so this runs on the merge. The tag and the publish are decided apart: a version already tagged
# is not tagged again, and a version npm lacks is published even when it was tagged earlier, so a failed
# publish is retried by running the workflow on the tag: gh workflow run release.yml --ref v<version>.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # the tag and the release
  id-token: write # npm trusted publishing: npm trusts this workflow, so no token or 2FA code is involved

# One release at a time, in order; a second merge waits rather than cancelling the first.
concurrency:
  group: release-main

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to a commit, not a tag that can be moved; Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - id: version
        run: node scripts/release.mjs --check
      # What a user installs, checked once more on the exact commit that ships.
      - if: steps.version.outputs.new == 'true'
        run: npm run smoke
      - if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" --title "${{ steps.version.outputs.version }}" --notes-file "${{ steps.version.outputs.notes }}"
      # The publish runs when npm lacks the version and the repository variable NPM_TRUSTED_PUBLISHING is
      # "true", which says each package on npmjs.com trusts this workflow (Settings, Trusted publisher:
      # GitHub Actions, victorsaly/dbtour, release.yml; npm answers 404 on publish when that is not so).
      # It publishes only from the tag's commit: the run that just made the tag, or one started on the tag.
      # npm's provenance names the commit and ref the run was started on (GITHUB_SHA, GITHUB_REF), not what
      # is checked out, so checking the tag out inside a run on main would sign it as main's commit. A run
      # on a later commit warns instead, naming the command that publishes from the tag. Trusted publishing
      # needs npm 11.5 or newer; the runner's Node 22 ships an older one.
      - if: steps.version.outputs.unpublished == 'true' && steps.version.outputs.new == 'false' && steps.version.outputs.at_tag != 'true'
        run: echo "::warning::npm lacks ${{ steps.version.outputs.version }}, but this run is not on its tag, so it did not publish. Publish from the tag with gh workflow run release.yml --ref v${{ steps.version.outputs.version }}"
      - if: steps.version.outputs.unpublished == 'true' && (steps.version.outputs.new == 'true' || steps.version.outputs.at_tag == 'true') && vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: npm install -g npm@latest
      - if: steps.version.outputs.unpublished == 'true' && (steps.version.outputs.new == 'true' || steps.version.outputs.at_tag == 'true') && vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: node scripts/release.mjs --publish --provenance
