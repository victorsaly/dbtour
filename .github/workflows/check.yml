name: Check

on:
  pull_request:
  push:
    branches: [main]

# Reads the code and nothing else: no token that can write.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit, not a tag that can be moved; Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # The page in the Chrome the runner image ships; skipped where there is none.
      - run: npm run e2e:page
      # What a user installs: the packed tarballs in an empty project, running dbtour from node_modules.
      - run: npm run smoke
